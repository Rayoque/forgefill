<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ForgeFill</title>
  <style>
    :root { --bg:#0d0d0f; --card:#1c1c1e; --text:#f5f5f7; --muted:#8e8e93; --accent:#0a84ff; --border:#2c2c2e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { width:340px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding:16px; }
    h1 { font-size:18px; font-weight:600; margin-bottom:4px; }
    .subtitle { font-size:12px; color:var(--muted); margin-bottom:16px; }
    .tabs { display:flex; gap:4px; margin-bottom:14px; background:var(--card); border-radius:10px; padding:3px; }
    .tabs button { flex:1; border:none; background:transparent; color:var(--muted); padding:8px; border-radius:8px; font-size:13px; cursor:pointer; }
    .tabs button.active { background:var(--accent); color:white; font-weight:500; }
    label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; margin-top:10px; }
    input, select { width:100%; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:9px 11px; color:var(--text); font-size:14px; }
    input:focus, select:focus { outline:none; border-color:var(--accent); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .actions { display:flex; gap:8px; margin-top:18px; }
    button.primary { flex:1; background:var(--accent); color:white; border:none; border-radius:10px; padding:11px; font-size:14px; font-weight:500; cursor:pointer; }
    button.secondary { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:13px; cursor:pointer; }
    .status { margin-top:12px; font-size:12px; color:var(--muted); min-height:16px; }
    .hint { font-size:11px; color:var(--muted); margin-top:14px; line-height:1.4; }
  </style>
</head>
<body>
  <h1>ForgeFill</h1>
  <p class="subtitle">Autocomplete on steroids for new accounts</p>
  <div class="tabs">
    <button id="tab-personal" class="active" data-tab="personal">Personal</button>
    <button id="tab-work" data-tab="work">Work</button>
  </div>
  <div id="form">
    <div class="row">
      <div><label>First name</label><input id="firstName" autocomplete="given-name" /></div>
      <div><label>Last name</label><input id="lastName" autocomplete="family-name" /></div>
    </div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" />
    <label>Phone (optional)</label>
    <input id="phone" type="tel" autocomplete="tel" />
    <div id="work-fields" style="display:none">
      <label>Company</label>
      <input id="company" autocomplete="organization" />
      <label>Job title</label>
      <input id="jobTitle" />
    </div>
    <label>Password style</label>
    <select id="passwordStyle">
      <option value="apple">Apple-style (20-char, recommended)</option>
      <option value="high-entropy">High-entropy (24-char pure random)</option>
    </select>
  </div>
  <div class="actions">
    <button class="primary" id="save">Save Profile</button>
    <button class="secondary" id="fill">Fill Page</button>
  </div>
  <p class="status" id="status"></p>
  <p class="hint">On any signup page, use the blue FF button (bottom-right) or right-click a field. Passwords are generated fresh every time and never stored.</p>
  <script src="popup.js"></script>
</body>
</html>
